<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">ihav-leaderboards: quality versus price with a Pareto frontier</title>
  <desc id="d">Synthetic example. Eight candidates plotted by merged quality score and price. A line joins the candidates that no other candidate beats on both quality and price. Point size shows confidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#141B34"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>

  <text x="64" y="86" fill="#F8FAFC" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700">ihav-leaderboards</text>
  <text x="64" y="128" fill="#A5B4FC" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">32 public leaderboards in. One quality-first ranking out.</text>
  <text x="64" y="182" fill="#CBD5E1" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
    <tspan x="64" dy="0">1. Chatbots name the leaderboards</tspan>
    <tspan x="64" dy="30">2. Visits decide each board's weight</tspan>
    <tspan x="64" dy="30">3. Scores are min-max normalized to 0-100</tspan>
    <tspan x="64" dy="30">4. Weighted average + confidence</tspan>
    <tspan x="64" dy="30">5. A Pareto chart for every cost dimension</tspan>
  </text>
  <text x="64" y="470" fill="#64748B" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Synthetic example. Not real vendor data.</text>

  <g transform="translate(560 64)">
    <rect width="576" height="392" rx="16" fill="#0F172A" stroke="#1E293B"/>
    <text x="24" y="36" fill="#E2E8F0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Quality vs price · OCR API (synthetic)</text>
    <g stroke="#1E293B">
      <line x1="64" y1="80" x2="552" y2="80"/>
      <line x1="64" y1="160" x2="552" y2="160"/>
      <line x1="64" y1="240" x2="552" y2="240"/>
      <line x1="64" y1="320" x2="552" y2="320"/>
    </g>
    <line x1="64" y1="340" x2="552" y2="340" stroke="#475569"/>
    <line x1="64" y1="60" x2="64" y2="340" stroke="#475569"/>
    <g fill="#94A3B8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
      <text x="56" y="84" text-anchor="end">100</text>
      <text x="56" y="164" text-anchor="end">75</text>
      <text x="56" y="244" text-anchor="end">50</text>
      <text x="56" y="324" text-anchor="end">25</text>
      <text x="308" y="372" text-anchor="middle">Price, USD per 1,000 pages (lower is better)</text>
      <text x="20" y="200" text-anchor="middle" transform="rotate(-90 20 200)">Quality score</text>
    </g>
    <polyline points="104,262 176,170 288,118 456,92" fill="none" stroke="#818CF8" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#818CF8">
      <circle cx="104" cy="262" r="9"/>
      <circle cx="176" cy="170" r="12"/>
      <circle cx="288" cy="118" r="10"/>
      <circle cx="456" cy="92" r="14"/>
    </g>
    <g fill="#475569">
      <circle cx="232" cy="236" r="8"/>
      <circle cx="352" cy="190" r="11"/>
      <circle cx="420" cy="276" r="6"/>
      <circle cx="512" cy="156" r="9"/>
    </g>
    <g fill="#E2E8F0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
      <text x="118" y="282">Vendor A</text>
      <text x="160" y="166" text-anchor="end">Vendor B</text>
      <text x="288" y="98" text-anchor="middle">Vendor C</text>
      <text x="420" y="78">Vendor D</text>
    </g>
  </g>
</svg>
